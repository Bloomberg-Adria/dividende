name: Slovenija dividende (SBITOP)

on:
  schedule:
    - cron: "30 5 * * *"     # svaki dan u 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Instaliraj Tesseract (slovenski) i Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-slv poppler-utils
          tesseract --list-langs

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj Python pakete
        run: pip install pypdf pytesseract pdf2image

      - name: Pokreni slovenski robot
        run: python si_robot.py SVE

      - name: Spremi rezultat na GitHub
        run: |
          if [ ! -s dividende_si.json ]; then
            echo "dividende_si.json je prazan - ne commitam."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --soft origin/main
          git add dividende_si.json
          if git diff --cached --quiet; then
            echo "Nema promjena - ne commitam."
            exit 0
          fi
          git commit -m "Auto: slovenske dividende $(date -u +%F)"
          git push origin HEAD:main
